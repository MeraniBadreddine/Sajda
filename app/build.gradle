plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def signingProps = new Properties()
def signingPropsFile = file("C:/Users/DELL/AndroidSigning/sajda-signing.properties")
if (!signingPropsFile.exists()) throw new GradleException("Signing properties file not found")
signingPropsFile.withInputStream { signingProps.load(it) }

android {
    buildFeatures {
        buildConfig true
    }
    namespace 'com.sajda'
    compileSdk 35

    defaultConfig {
        applicationId 'com.sajda'
        minSdk 26
        targetSdk 35
        versionCode 19
        versionName '1.9.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    signingConfigs {
        release {
            storeFile file(signingProps["storeFile"])
            storePassword signingProps["storePassword"]
            keyAlias signingProps["keyAlias"]
            keyPassword signingProps["keyPassword"]
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
    buildFeatures { viewBinding true }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.activity:activity-ktx:1.9.2'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.6'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.8.6'

    testImplementation 'junit:junit:4.13.2'
}